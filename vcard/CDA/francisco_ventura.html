<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Presentación - Francisco Ventura</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
    <div class="business-card">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="./img/CDA_LOGO.svg" alt="Central de Alarmas" class="main-logo">
        </div>
        
        <!-- Profile Section -->
        <div class="profile-section">
            <div class="profile-container">
                <img src="./foto/francisco_ventura.png" alt="Foto de perfil" class="profile-img">
            </div>
        </div>
        
        <!-- Info Contact Section -->
        <div class="info-contact-section">
            <h1 class="name">FRANCISCO VENTURA</h1>
            <p class="position">GERENTE DE PROYECTOS</p>
            <div class="info-item info-item-1">
                <span class="dot">•</span>
                <span>Estrategia de preventa y desarrollo de proyectos</span>
            </div>
            <div class="info-item info-item-2">
                <span class="dot">•</span>
                <span>Asesoramiento en seguridad</span>
            </div>
            <div class="info-item info-item-3">
                <span class="dot">•</span>
                <span>Ingeniería y diseño de soluciones integrales</span>
            </div>
            <div class="contact-item contact-item-1">
                <span>fventura@centraldealarmas.com.mx</span>
            </div>
            <div class="contact-item contact-item-2">
                <a href="https://wa.me/5662164357" target="_blank">
                    <i class="fab fa-whatsapp"></i>
                    <span>56 6216 4357</span>
                </a>
            </div>
        </div>
        
        <!-- Social Media Section -->
        <div class="social-section">
            <div class="social-icons">
                <a href="https://www.instagram.com/centraldealarmas.mx/" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.facebook.com/NewCAMSA/" target="_blank">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="https://www.linkedin.com/company/central-de-alarmas-de-m%C3%A9xico/" target="_blank">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://x.com/newcamsa" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </a>
                <a href="https://www.youtube.com/channel/UCHBXHHeJ6mpRiPTteQ6AUUA" target="_blank">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="https://www.youtube.com/channel/UCHBXHHeJ6mpRiPTteQ6AUUA" target="_blank">
                    <i class="fab fa-tiktok"></i>
                </a>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-left">
                <img src="./img/GRUPO_LOGO.svg" alt="GSI" class="gsi-logo">
            </div>
            <div class="footer-right">
                <a href="https://centraldealarmas.website/" class="website" target="_blank">centraldealarmas.com.mx</a>
            </div>
        </div>
    </div>
</body>
</html>
